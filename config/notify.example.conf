# Beispiel für /etc/disown/notify.conf
NOTIFY_TO=admin@example.org,operator@example.org
APP_URL=https://sicher.bbs-einbeck.de/disown/admin
NOTIFY_LIMIT=50
NOTIFY_STATE_FILE=/home/marc/disown-notify-state.json

; Version 2.3: optional short mail push for every new WebClip request.
; The on/off state is controlled in the admin portal and stored in app_settings.
; PUSH_MAIL_TO falls back to NOTIFY_TO if omitted.
PUSH_MAIL_TO=admin@example.org
PUSH_MAIL_SEND_IN_DEV=false
