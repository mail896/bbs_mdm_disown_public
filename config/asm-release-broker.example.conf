# Copy to /etc/disown/asm-release-broker.conf and adjust locally.
# Keep this file readable only for root/www-data in production.

ASM_JAMF_MDM_SERVER_ID="YOUR_JAMF_SCHOOL_MDM_SERVER_ID"
ASM_BROKER_MDM_SERVER_ID="YOUR_RELEASE_BROKER_MDM_SERVER_ID"

# Local NanoDEP depserver endpoint for the release broker.
ASM_BROKER_DEP_BASE_URL="http://127.0.0.1:9001"
ASM_BROKER_DEP_NAME="asm-release-broker"

# Prefer a protected file readable by www-data over storing the key inline.
ASM_BROKER_DEP_API_KEY_FILE="/srv/disown-protected/asm-release-broker/nanodep-api.key"
# ASM_BROKER_DEP_API_KEY=""
