; Copy to /etc/disown/asm.conf.
; Apple School Manager API client settings.
; The private key and JWT helper stay outside the webroot.

ASM_CLIENT_ID=your-asm-client-id
ASM_KEY_ID=your-asm-key-id
ASM_TEAM_ID=your-asm-team-id
ASM_PRIVATE_KEY=/etc/disown/asm-private-key.pem
ASM_JWT_HELPER=/etc/disown/asm-jwt.py
